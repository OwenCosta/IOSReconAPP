name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: ReconCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ReconCore
        run: swift test

  ios:
    name: Build iOS app + ReconCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ReconCore tests (macOS, includes loopback scanner tests)
        working-directory: ReconCore
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set +e            # do not let the failing pipeline abort before we print diagnostics
          set -o pipefail
          xcodebuild build \
            -project ReconKit.xcodeproj \
            -scheme ReconKit \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log | tail -n 40
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler errors"
            grep -nE "error:" /tmp/xcodebuild.log | head -n 100
            echo "::endgroup::"
          fi
          exit $status
