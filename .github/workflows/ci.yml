name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: ReconCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ReconCore
        run: swift test

  ios:
    name: Build iOS app + ReconCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: ReconCore tests (macOS, includes loopback scanner tests)
        working-directory: ReconCore
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set +e            # do not let the failing pipeline abort before we print diagnostics
          set -o pipefail
          # Swift macro plugins (e.g. MLXHuggingFaceMacros, pulled in by the on-device AI
          # model's mlx-swift-lm dependency) normally need a one-time interactive "Trust &
          # Enable" click in Xcode before they're allowed to run at build time. CI has no UI
          # for that dialog, so it hard-fails with "must be enabled before it can be used"
          # unless these two defaults are set first, which tell Xcode to skip that prompt.
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          # Xcode 26's "prebuilt swift-syntax for macros" feature downloads a prebuilt macro-
          # plugin binary instead of compiling the macro target from source, and is known to
          # grab one built for the wrong configuration on iOS targets, producing exactly this
          # failure: "external macro implementation type ... produced malformed response" for
          # MLXHuggingFaceMacros. Disabling it forces Xcode to build the macro plugin itself.
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          # 'generic/platform=iOS Simulator' builds a universal (arm64 + x86_64) simulator
          # binary. On these Apple Silicon runners that means cross-compiling an x86_64 slice
          # under Rosetta, and the MLXHuggingFaceMacros plugin executable (a build-time host
          # tool, not app code) fails to run in that cross slice ("DYLD_ROOT_PATH not set for
          # simulator program", then "produced malformed response"). Targeting one concrete
          # arm64 simulator device builds native-arch only and avoids that broken combination.
          xcodebuild build \
            -project ReconKit.xcodeproj \
            -scheme ReconKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log | tail -n 40
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler errors"
            grep -nE "error:" /tmp/xcodebuild.log | head -n 100
            echo "::endgroup::"
          fi
          exit $status
