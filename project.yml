name: ReconKit
options:
  bundleIdPrefix: com.reconkit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ReconCore:
    path: ReconCore
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.9.2
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
targets:
  ReconKit:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ReconCore
      - package: Citadel
        product: Citadel
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
    settings:
      base:
        # >>> Change these two for your own Apple ID / team before running on a device <<<
        PRODUCT_BUNDLE_IDENTIFIER: com.reconkit.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/ReconKit.entitlements
      properties:
        # Lets the on-device AI model (MLX) use more of the device's RAM before iOS kills the
        # app for memory pressure — a 4-bit-quantised 7-8B model needs several GB resident.
        # Still needs the matching capability enabled for your own Apple Developer account/
        # provisioning profile to take effect on a real device.
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NetTactix
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: ReconKit scans and discovers devices on your local network (host discovery, port scanning, Bonjour).
        NSBluetoothAlwaysUsageDescription: ReconKit scans for nearby Bluetooth Low Energy devices (advertised name, services, signal strength) for wireless reconnaissance.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSBonjourServices:
        - _adisk._tcp
        - _afpovertcp._tcp
        - _airplay._tcp
        - _companion-link._tcp
        - _daap._tcp
        - _device-info._tcp
        - _ftp._tcp
        - _googlecast._tcp
        - _hap._tcp
        - _homekit._tcp
        - _http._tcp
        - _https._tcp
        - _ipp._tcp
        - _mediaremotetv._tcp
        - _nfs._tcp
        - _printer._tcp
        - _raop._tcp
        - _rfb._tcp
        - _sftp-ssh._tcp
        - _sleep-proxy._udp
        - _smb._tcp
        - _spotify-connect._tcp
        - _ssh._tcp
        - _telnet._tcp
        - _workstation._tcp
schemes:
  ReconKit:
    build:
      targets:
        ReconKit: all
    run:
      config: Debug
    test:
      config: Debug
